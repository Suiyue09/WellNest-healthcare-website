<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WellNest — Offline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: #f0f6ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 3rem 2rem;
            box-shadow: 0 8px 30px rgba(13,36,84,0.1);
            max-width: 380px;
        }
        .emoji { font-size: 4rem; margin-bottom: 1rem; }
        h1 { font-size: 1.6rem; color: #0d2454; margin-bottom: 0.8rem; }
        p { color: #6b7a99; font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem; }
        button {
            background: #1246a0;
            color: #fff;
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { opacity: 0.88; }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">📡</div>
        <h1>You're offline</h1>
        <p>No internet connection detected. Please check your connection and try again.</p>
        <button onclick="window.location.reload()">Try again</button>
    </div>
</body>
</html>
